version: "3.9"

services:
  traefik:
    image: traefik:v3.5
    command:
      - --providers.swarm=true
      - --providers.swarm.exposedByDefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --accesslog=false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - edge
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: on-failure

  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/alltomatos/dontstop-gateway:latest}
    environment:
      PORT: "8080"
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      MASTER_KEY_FILE: /run/secrets/master_key
      NATS_URL_FILE: /run/secrets/nats_url
    secrets:
      - database_url
      - redis_url
      - master_key
      - nats_url
    networks:
      - edge
      - app
      - data
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "/app/gateway", "healthcheck"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3
    deploy:
      replicas: 3
      placement:
        constraints:
          - node.labels.tier == app
      update_config:
        parallelism: 2
        delay: 30s
        order: start-first
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0.1
      rollback_config:
        parallelism: 2
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      labels:
        - traefik.enable=true
        - traefik.docker.network=dontstop_edge
        - traefik.http.routers.gateway.rule=Host(`${GATEWAY_HOST:-gateway.dontstop.corp}`)
        - traefik.http.routers.gateway.entrypoints=websecure
        - traefik.http.routers.gateway.tls=true
        - traefik.http.services.gateway.loadbalancer.server.port=8080
        - traefik.http.services.gateway.loadbalancer.responseForwarding.flushInterval=100ms

networks:
  edge:
    driver: overlay
  app:
    driver: overlay
  data:
    driver: overlay
    driver_opts:
      encrypted: "true"

secrets:
  database_url:
    external: true
  redis_url:
    external: true
  master_key:
    external: true
  nats_url:
    external: true
