version: "3.9"

services:
  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/alltomatos/dontstop-gateway:latest}
    environment:
      PORT: "8080"
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      MASTER_KEY_FILE: /run/secrets/master_key
      NATS_URL_FILE: /run/secrets/nats_url
      AGENTROUTER_RELAY_URL: http://agentrouter-relay:7187
    secrets:
      - database_url
      - redis_url
      - master_key
      - nats_url
    ports:
      - "8080:8080"
    networks:
      - dontstop
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "/app/gateway", "healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        delay: 0s
        order: start-first
        failure_action: rollback
        monitor: 30s
      rollback_config:
        parallelism: 1
        delay: 0s
        order: start-first
      restart_policy:
        condition: any
        delay: 0s
        max_attempts: 0

  agentrouter-relay:
    image: ${AGENTROUTER_RELAY_IMAGE:-registry/dontstop-agentrouter-relay:latest}
    environment:
      AGENTROUTER_PORT: "7187"
      AGENTROUTER_BIND: "0.0.0.0"
      AGENTROUTER_UPSTREAM: https://agentrouter.org
    networks:
      - dontstop
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7187/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

networks:
  dontstop:
    driver: overlay

secrets:
  database_url:
    external: true
  redis_url:
    external: true
  master_key:
    external: true
  nats_url:
    external: true
