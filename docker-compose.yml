name: dontstop

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DONTSTOP_HOST: ${DONTSTOP_HOST:-dontstop.alltomatos.dev.br}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      gateway:
        condition: service_healthy
      admin:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dontstop
      POSTGRES_USER: dontstop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dontstop -d dontstop"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    image: ronaldodavi/dontstop-gateway:onboarding-20261108
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://dontstop:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/dontstop?sslmode=disable}
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  gateway:
    image: ronaldodavi/dontstop-gateway:onboarding-20261108
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:-postgres://dontstop:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/dontstop?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MASTER_KEY: ${MASTER_KEY:?MASTER_KEY must be set in .env}
    networks:
      - edge
      - app
      - data
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "/app/gateway", "healthcheck"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  admin:
    image: ronaldodavi/dontstop-admin:onboarding-20261108
    restart: unless-stopped
    environment:
      DONTSTOP_GATEWAY_URL: http://gateway:8080
      DONTSTOP_PUBLIC_BASE_URL: ${DONTSTOP_PUBLIC_BASE_URL:-https://${DONTSTOP_HOST:-dontstop.alltomatos.dev.br}}
      DONTSTOP_LOCAL_BASE_URL: http://gateway:8080
      DONTSTOP_BASE_PATH: ""
      DONTSTOP_TRUST_PROXY: "on"
      DONTSTOP_CONSOLE_AUTH: "on"
    networks:
      - edge
      - app
    depends_on:
      gateway:
        condition: service_healthy

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
