name: gateway

on:
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway.yml"
  push:
    branches: [main]
    paths:
      - "gateway/**"
      - ".github/workflows/gateway.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - run: go build ./...
      - run: go test -race ./...
      - run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.6
          working-directory: gateway

  vulnerability:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: govulncheck ./...
