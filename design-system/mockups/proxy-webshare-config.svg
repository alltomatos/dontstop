<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-label="Mock do modal Configurar Webshare: token, teste de conexão, plano, país, sticky, limite por IP, quarentena e sincronização">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .surface { fill: #FFFFFF; }
      .border { fill: none; stroke: #E2E8F0; stroke-width: 1; }
      .sidebar { fill: #1E3A8A; }
      .text { fill: #0F172A; font-family: 'Fira Sans','Segoe UI',Arial,sans-serif; }
      .muted { fill: #475569; font-family: 'Fira Sans','Segoe UI',Arial,sans-serif; }
      .faint { fill: #94A3B8; font-family: 'Fira Sans','Segoe UI',Arial,sans-serif; }
      .white { fill: #FFFFFF; font-family: 'Fira Sans','Segoe UI',Arial,sans-serif; }
      .mono { font-family: 'Fira Code',Consolas,monospace; fill: #0F172A; }
      .small { font-size: 12px; }
      .tiny { font-size: 11px; }
      .label { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; fill: #64748B; font-family: 'Fira Sans','Segoe UI',Arial,sans-serif; }
      .field-label { font-size: 11px; fill: #475569; font-family: 'Fira Sans','Segoe UI',Arial,sans-serif; }
      .chip-green { fill: #ECFDF5; }
      .chip-green-t { fill: #047857; font-size: 11px; font-weight: 600; font-family: 'Fira Sans','Segoe UI',Arial,sans-serif; }
      .chip { fill: #F1F5F9; }
      .chip-gray-t { fill: #475569; font-size: 11px; font-weight: 600; font-family: 'Fira Sans','Segoe UI',Arial,sans-serif; }
      .btn { fill: #FFFFFF; stroke: #CBD5E1; }
      .btn-primary { fill: #1E3A8A; }
      .btn-t { fill: #0F172A; font-size: 12px; font-weight: 600; font-family: 'Fira Sans','Segoe UI',Arial,sans-serif; }
      .btn-primary-t { fill: #FFFFFF; font-size: 12px; font-weight: 600; font-family: 'Fira Sans','Segoe UI',Arial,sans-serif; }
      .divider { stroke: #EEF2F7; stroke-width: 1; }
      .bar-bg { fill: #E2E8F0; }
      .assoc { fill: #F8FAFC; stroke: #E2E8F0; }
      .input { fill: #FFFFFF; stroke: #CBD5E1; }
      .dot-s { fill: #059669; }
      .seg { fill: #F1F5F9; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="1120"/>

  <!-- Página de fundo (silhueta) -->
  <rect class="sidebar" width="240" height="1120"/>
  <text x="52" y="48" class="white" font-size="18" font-weight="700">DonStop IA</text>
  <rect x="240" y="0" width="1200" height="56" class="surface"/>
  <line x1="240" y1="56" x2="1440" y2="56" class="divider"/>
  <rect x="272" y="12" width="680" height="32" rx="8" fill="#F1F5F9"/>
  <rect x="288" y="96" width="380" height="32" rx="6" fill="#E2E8F0" opacity=".7"/>
  <rect x="288" y="176" width="211" height="88" rx="12" class="surface"/>
  <rect x="511" y="176" width="211" height="88" rx="12" class="surface"/>
  <rect x="734" y="176" width="211" height="88" rx="12" class="surface"/>
  <rect x="957" y="176" width="211" height="88" rx="12" class="surface"/>
  <rect x="1180" y="176" width="211" height="88" rx="12" class="surface"/>
  <rect x="288" y="284" width="700" height="32" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="288" y="336" width="1104" height="548" rx="12" class="surface"/>
  <rect x="288" y="336" width="1104" height="548" rx="12" class="border"/>
  <g stroke="#EEF2F7">
    <line x1="288" y1="380" x2="1392" y2="380"/>
    <line x1="304" y1="452" x2="1376" y2="452"/>
    <line x1="304" y1="524" x2="1376" y2="524"/>
    <line x1="304" y1="596" x2="1376" y2="596"/>
    <line x1="304" y1="668" x2="1376" y2="668"/>
    <line x1="304" y1="740" x2="1376" y2="740"/>
    <line x1="304" y1="812" x2="1376" y2="812"/>
  </g>
  <rect x="288" y="900" width="1104" height="72" rx="12" class="surface"/>
  <rect x="288" y="992" width="357" height="240" rx="12" class="surface"/>
  <rect x="661" y="992" width="357" height="240" rx="12" class="surface"/>
  <rect x="1034" y="992" width="357" height="240" rx="12" class="surface"/>

  <!-- Overlay -->
  <rect x="0" y="0" width="1440" height="1120" fill="#0F172A" opacity="0.35"/>

  <!-- Modal -->
  <rect x="392" y="120" width="8" height="840" fill="#0F172A" opacity="0.12"/>
  <rect x="400" y="120" width="640" height="840" rx="16" class="surface"/>
  <rect x="400" y="120" width="640" height="840" rx="16" class="border"/>

  <text x="440" y="168" class="text" font-size="22" font-weight="700">Configurar Webshare</text>
  <text x="440" y="192" class="muted small">Conecte o pool por API key e plan ID opcional. A chave fica cifrada e nunca é exibida novamente.</text>
  <path d="M984 160 l12 12 M996 160 l-12 12" stroke="#64748B" stroke-width="1.8"/>
  <line x1="400" y1="212" x2="1040" y2="212" class="divider"/>

  <!-- Credencial -->
  <text x="440" y="242" class="label">Credencial</text>
  <text x="440" y="266" class="field-label">API key</text>
  <rect x="440" y="274" width="424" height="40" rx="8" class="input"/>
  <text x="456" y="299" class="mono" font-size="13">••••••••••••••••••••••••</text>
  <g stroke="#64748B" stroke-width="1.3" fill="none">
    <path d="M816 294 c6 -7 14 -7 20 0 c-6 7 -14 7 -20 0 z"/>
    <circle cx="826" cy="294" r="2.6"/>
  </g>
  <rect x="876" y="274" width="124" height="40" rx="8" class="btn"/>
  <text x="896" y="299" class="btn-t">Testar conexão</text>

  <text x="440" y="334" class="small" fill="#1F4FD1" font-family="'Fira Sans','Segoe UI',Arial,sans-serif">Criar token no dashboard ↗</text>
  <rect x="440" y="348" width="560" height="44" rx="8" fill="#ECFDF5" stroke="#A7F3D0"/>
  <circle cx="458" cy="370" r="5" class="dot-s"/>
  <text x="472" y="374" class="text small" font-weight="600">Conectado · token válido</text>
  <text x="984" y="374" class="muted small" text-anchor="end">Proxy-500 · 128 IPs</text>
  <text x="440" y="414" class="faint tiny">Token cifrado com AES-256-GCM e nunca gravado em logs ou traces.</text>
  <line x1="440" y1="430" x2="1000" y2="430" class="divider"/>

  <!-- Plano -->
  <text x="440" y="458" class="label">Plano (após testar)</text>
  <rect x="440" y="468" width="560" height="84" rx="10" class="assoc"/>
  <text x="460" y="492" class="label">Plano</text>
  <text x="460" y="514" class="text" font-size="14" font-weight="700">Proxy-500</text>
  <text x="460" y="532" class="faint tiny">renovação mensal</text>

  <text x="620" y="492" class="label">IPs</text>
  <text x="620" y="514" class="text" font-size="14" font-weight="700">128 / 500</text>
  <text x="620" y="532" class="faint tiny">96 atribuídos</text>

  <text x="760" y="492" class="label">Banda</text>
  <text x="760" y="514" class="text" font-size="14" font-weight="700">42%</text>
  <rect x="760" y="522" width="110" height="5" rx="2.5" class="bar-bg"/>
  <rect x="760" y="522" width="46" height="5" rx="2.5" fill="#0EA5E9"/>

  <text x="900" y="492" class="label">Última sync</text>
  <text x="900" y="514" class="text" font-size="14" font-weight="700">12:42</text>
  <text x="900" y="532" class="faint tiny">há 18 min</text>
  <line x1="440" y1="572" x2="1000" y2="572" class="divider"/>

  <!-- Padrões -->
  <text x="440" y="600" class="label">Padrões de atribuição</text>

  <text x="440" y="626" class="field-label">Modo padrão das novas contas</text>
  <rect x="440" y="634" width="360" height="36" rx="18" class="seg"/>
  <rect x="440" y="634" width="120" height="36" rx="18" class="btn"/>
  <text x="492" y="657" class="muted small">Off</text>
  <rect x="560" y="634" width="120" height="36" rx="18" fill="#1E3A8A"/>
  <text x="594" y="657" class="white small" font-weight="600">Preferred</text>
  <rect x="680" y="634" width="120" height="36" rx="18" class="btn"/>
  <text x="716" y="657" class="muted small">Required</text>
  <text x="440" y="686" class="faint tiny">Preferred usa o proxy e cai para direto; Required falha fechado se o proxy não estiver saudável.</text>

  <text x="440" y="714" class="field-label">País preferido</text>
  <rect x="440" y="722" width="240" height="36" rx="8" class="input"/>
  <text x="456" y="745" class="text small">Brasil (BR)</text>
  <path d="M656 738 l4 4 4-4" stroke="#475569" stroke-width="1.3" fill="none"/>

  <text x="700" y="714" class="field-label">Sticky (min)</text>
  <rect x="700" y="722" width="120" height="36" rx="8" class="input"/>
  <text x="716" y="745" class="mono" font-size="13">30</text>

  <text x="836" y="714" class="field-label">Máx. contas / IP</text>
  <rect x="836" y="722" width="164" height="36" rx="8" class="input"/>
  <text x="852" y="745" class="mono" font-size="13">3</text>
  <text x="852" y="752" class="faint tiny"></text>

  <rect x="440" y="778" width="36" height="20" rx="10" fill="#1E3A8A"/>
  <circle cx="466" cy="788" r="8" fill="#FFFFFF"/>
  <text x="488" y="792" class="text small">Fallback direto quando o proxy falhar</text>
  <text x="984" y="792" class="faint tiny" text-anchor="end">aplicado em preferred</text>

  <rect x="440" y="812" width="36" height="20" rx="10" fill="#1E3A8A"/>
  <circle cx="466" cy="822" r="8" fill="#FFFFFF"/>
  <text x="488" y="826" class="text small">Sincronizar automaticamente</text>
  <rect x="820" y="810" width="180" height="30" rx="8" class="input"/>
  <text x="836" y="829" class="text small">A cada 60 min</text>
  <path d="M976 821 l4 4 4-4" stroke="#475569" stroke-width="1.3" fill="none"/>

  <rect x="440" y="846" width="36" height="20" rx="10" fill="#1E3A8A"/>
  <circle cx="466" cy="856" r="8" fill="#FFFFFF"/>
  <text x="488" y="860" class="text small">Quarentena após 3 falhas</text>
  <text x="984" y="860" class="faint tiny" text-anchor="end">10 min · health check automático</text>

  <!-- Footer -->
  <line x1="400" y1="880" x2="1040" y2="880" class="divider"/>
  <rect x="756" y="900" width="112" height="40" rx="8" class="btn"/>
  <text x="780" y="925" class="btn-t">Cancelar</text>
  <rect x="880" y="900" width="160" height="40" rx="8" class="btn-primary"/>
  <text x="898" y="925" class="btn-primary-t">Salvar e sincronizar</text>

  <text x="440" y="925" class="faint tiny">O teste usa apenas o token informado.</text>

  <text x="1392" y="1092" class="faint tiny" text-anchor="end">Mock para aprovação · modal Configurar Webshare</text>
</svg>
